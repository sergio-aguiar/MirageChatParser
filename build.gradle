plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "MirageEssentials"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
	maven { url "https://maven.impactdev.net/repository/development/" }
    maven { url "https://repo.repsy.io/mvn/cobblemon/cobblemon" }

	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}

	maven {
        name = "LandonJW Snapshots"
        url = "https://maven.landonjw.ca/snapshots"
    }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mirageessentials" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// Minecraft
	minecraft("com.mojang:minecraft:${project.minecraft_version}")

	// Fabric is required
	mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
	modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
	modImplementation("net.fabricmc:fabric-language-kotlin:${project.kotlin_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

	// Cobblemon is required
	modImplementation("com.cobblemon:fabric:${project.cobblemon_version}+${project.minecraft_version}-SNAPSHOT")

	// LuckPerms is optional
	compileOnly("net.luckperms:api:${project.luckperms_api_version}")

	// NightConfig (required for the config system - bundled)
	implementation  include("com.electronwill.night-config:core:${project.night_config_version}")
	implementation  include("com.electronwill.night-config:toml:${project.night_config_version}")
	implementation  include("com.electronwill.night-config:json:${project.night_config_version}")

	// Gooeylibs (UI library) is required
	modImplementation("ca.landonjw.gooeylibs:fabric:${project.gooeylibs_version}-SNAPSHOT")

	// Placeholder API is optional
	modCompileOnly("eu.pb4:placeholder-api:${project.placeholder_api_version}")

	// Adventure / MiniMessage (required for the config system - bundled)
    implementation include("net.kyori:adventure-text-minimessage:${project.adventure_minimessage_version}")
    modImplementation include("net.kyori:adventure-platform-fabric:${project.adventure_fabric_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}